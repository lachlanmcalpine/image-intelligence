name: tests

on:
  push:
  pull_request:

jobs:
  logic-core:
    # The crypto / compression / product-quantization logic runs with no ML
    # stack, camera, or network — exactly what requirements-dev.txt installs.
    # (The torch / opencv / chromadb-backed tests are intentionally not run in CI.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install logic-only deps
        run: pip install -r requirements-dev.txt
      - name: Run logic-core tests
        run: pytest tests/test_crypto.py tests/test_compression.py tests/test_pq_compression.py -v
